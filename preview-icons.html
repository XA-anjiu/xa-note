<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图标选择预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Inter', sans-serif; padding: 40px 20px; }
    h1 { text-align: center; margin-bottom: 30px; font-size: 18px; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 600px; margin: 0 auto; }
    .card {
      background: rgba(25, 25, 35, 0.75);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .card:hover {
      border-color: rgba(255,255,255,0.4);
      transform: translateY(-2px);
    }
    .card .num {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
    }
    .card svg { width: 28px; height: 28px; }
    .card .label { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 10px; }

    .demo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 40px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .demo-card {
      background: rgba(25, 25, 35, 0.75);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      padding: 12px 16px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .demo-card .icon { flex-shrink: 0; }
    .demo-card .icon svg { width: 16px; height: 16px; }
    .demo-card .text {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
    }
    .demo-label { font-size: 11px; color: rgba(255,255,255,0.3); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- 预览效果 -->
  <h2 style="text-align:center; margin-top:50px; font-size:14px; font-weight:500; color:rgba(255,255,255,0.5);">预览效果</h2>

    <div class="demo-card">
      <div class="icon" id="demo-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="6" r="3.5" fill="#2dd4bf" opacity="0.7"/>
          <circle cx="6.5" cy="10.5" r="3.5" fill="#2dd4bf" opacity="0.7"/>
          <circle cx="17.5" cy="10.5" r="3.5" fill="#2dd4bf" opacity="0.7"/>
          <circle cx="8" cy="16" r="3.5" fill="#2dd4bf" opacity="0.7"/>
          <circle cx="16" cy="16" r="3.5" fill="#2dd4bf" opacity="0.7"/>
          <circle cx="12" cy="11.5" r="3" fill="#facc15" opacity="0.9"/>
        </svg>
      </div>
      <div class="text">这段文字是高亮内容的示例</div>
    </div>
  </div>
  <div class="demo-label">选择上方图标后会在这里预览</div>

</body>
</html>
